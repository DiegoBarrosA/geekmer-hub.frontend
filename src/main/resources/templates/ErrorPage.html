<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
</head>
<body>
    <h1>An Error Occurred</h1>
    <p th:if="${error}" th:text="${error}">Default error message if none provided.</p>
    <p th:unless="${error}">An unexpected error occurred.</p>
    <a href="/">Go Home</a>
</body>
</html>
